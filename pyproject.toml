[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Random maze generator with perfect and non-perfect modes"
readme = "mazegen/README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "yanard" }]

[tool.setuptools]
packages = ["mazegen"]

[tool.mypy]
exclude = ["build/", "dist/", "venv/", ".venv/"]
